<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تم الدفع بنجاح — نزلها بلس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/static/images/app-icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0a0a0f; --card: #16161f; --border: #2a2a3a; --text: #f0f0f8; --muted: #8888aa; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .box { background: var(--card); border: 1px solid #2a6a3a; border-radius: 20px; padding: 2.5rem 2rem; text-align: center; max-width: 400px; width: 100%; }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 900; color: #4ade80; margin-bottom: .6rem; }
    p { color: var(--muted); font-size: .9rem; line-height: 1.7; margin-bottom: 1.2rem; }
    .steps { background: rgba(74,222,128,.08); border: 1px solid rgba(74,222,128,.2); border-radius: 12px; padding: 1rem 1.2rem; text-align: right; margin-bottom: 1.5rem; }
    .steps p { margin: 0; color: var(--text); font-size: .88rem; }
    .steps span { color: #4ade80; font-weight: 700; }
    .btn { display: inline-block; background: linear-gradient(135deg,#16a34a,#4ade80); color: #000; text-decoration: none; border-radius: 12px; padding: .75rem 2rem; font-weight: 900; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">✅</div>
    <h1>تم الدفع بنجاح!</h1>
    <p>شكراً لك. اشتراكك مفعّل الآن. ارجع للتطبيق واضغط "تحقق من الدفع" لتفعيل Premium.</p>
    <div class="steps">
      <p><span>١.</span> افتح تطبيق نزلها بلس</p>
      <p><span>٢.</span> اضغط على زر "تحقق من الدفع"</p>
      <p><span>٣.</span> استمتع بتحميل غير محدود!</p>
    </div>
    <a href="/" class="btn">العودة للرئيسية</a>
  </div>
</body>
</html>
