<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تم إلغاء الدفع — نزلها بلس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/static/images/app-icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0a0a0f; --card: #16161f; --border: #2a2a3a; --text: #f0f0f8; --muted: #8888aa; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .box { background: var(--card); border: 1px solid #4a2a2a; border-radius: 20px; padding: 2.5rem 2rem; text-align: center; max-width: 400px; width: 100%; }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 900; color: #f87171; margin-bottom: .6rem; }
    p { color: var(--muted); font-size: .9rem; line-height: 1.7; margin-bottom: 1.5rem; }
    .btn { display: inline-block; background: linear-gradient(135deg,#7c3aed,#a855f7); color: #fff; text-decoration: none; border-radius: 12px; padding: .75rem 2rem; font-weight: 900; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">❌</div>
    <h1>تم إلغاء الدفع</h1>
    <p>لم يتم خصم أي مبلغ. يمكنك المحاولة مرة أخرى في أي وقت من داخل التطبيق.</p>
    <a href="/" class="btn">العودة للرئيسية</a>
  </div>
</body>
</html>
