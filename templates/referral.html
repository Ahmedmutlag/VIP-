<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دعوة للانضمام — نزّلها+</title>
  <meta name="description" content="صديقك يدعوك لتجربة نزّلها+ لتحميل الفيديوهات من تيك توك وانستاغرام ويوتيوب." />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #f0f0f8;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: #16161f;
      border: 1px solid #2a2a3a;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .logo { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; color: #f0f0f8; }
    .sub { color: #8888aa; font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
    .code-box {
      background: #1e1530;
      border: 1px solid #4c2d9e;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #a855f7;
      margin-bottom: 28px;
      font-family: monospace;
    }
    .features {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 32px;
      text-align: right;
    }
    .feature {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #c0c0d8;
    }
    .feature span { font-size: 18px; }
    .btn {
      display: block;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      padding: 16px 24px;
      border-radius: 14px;
      text-decoration: none;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .85; }
    .note { margin-top: 16px; font-size: 12px; color: #555570; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📥</div>
    <h1>دعوة خاصة من صديق</h1>
    <p class="sub">صديقك يدعوك لتجربة <strong>نزّلها+</strong><br>حمّل الفيديوهات من أي منصة بنقرة واحدة</p>

    <div class="code-box">{{ code }}</div>

    <div class="features">
      <div class="feature"><span>🎵</span> تيك توك، انستا، يوتيوب وأكثر من 50 منصة</div>
      <div class="feature"><span>⚡</span> تحميل فوري بجودة عالية</div>
      <div class="feature"><span>🆓</span> مجاني بدون تسجيل</div>
    </div>

    <a class="btn" href="https://play.google.com/store/apps/details?id=com.nazzilhaplus.app&referrer={{ code }}">
      ⬇️ حمّل التطبيق الآن
    </a>
    <p class="note">بعد التثبيت، أدخل الكود {{ code }} في التطبيق</p>
  </div>
</body>
</html>
